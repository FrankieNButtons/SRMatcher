<svg width="100%" viewBox="0 0 680 980" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .th { font-size: 14px; font-weight: 500; fill: #3C3489; }
  .ts { font-size: 12px; font-weight: 400; fill: #534AB7; }

  /* Phase A - purple */
  .pa-bg { fill: #EEEDFE; stroke: #AFA9EC; }
  .pa-card { fill: #EEEDFE; stroke: #AFA9EC; }
  .pa-title { fill: #3C3489; font-size: 14px; font-weight: 500; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .pa-sub { fill: #534AB7; font-size: 12px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .pa-note { fill: #534AB7; font-size: 12px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }

  /* Phase B - teal */
  .pb-bg { fill: #E1F5EE; stroke: #5DCAA5; }
  .pb-card { fill: #E1F5EE; stroke: #5DCAA5; }
  .pb-title { fill: #085041; font-size: 14px; font-weight: 500; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .pb-sub { fill: #0F6E56; font-size: 12px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .pb-note { fill: #0F6E56; font-size: 12px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }

  /* Phase C - amber */
  .pc-bg { fill: #FAEEDA; stroke: #EF9F27; }
  .pc-card { fill: #FAEEDA; stroke: #EF9F27; }
  .pc-title { fill: #633806; font-size: 14px; font-weight: 500; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .pc-sub { fill: #854F0B; font-size: 12px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .pc-note { fill: #854F0B; font-size: 12px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }

  /* Phase D - coral */
  .pd-bg { fill: #FAECE7; stroke: #F0997B; }
  .pd-card { fill: #FAECE7; stroke: #F0997B; }
  .pd-title { fill: #4A1B0C; font-size: 14px; font-weight: 500; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .pd-sub { fill: #993C1D; font-size: 12px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .pd-note { fill: #993C1D; font-size: 12px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }

  /* Phase E - gray */
  .pe-bg { fill: #F1EFE8; stroke: #B4B2A9; }
  .pe-title { fill: #444441; font-size: 14px; font-weight: 500; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .pe-sub { fill: #5F5E5A; font-size: 12px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }

  .arr { fill: none; stroke: #B4B2A9; stroke-width: 1.5; }
</style>
