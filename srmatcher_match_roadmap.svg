<!-- Phase A: Embedding baseline -->
<rect x="30" y="30" width="620" height="185" rx="12" stroke-width="0.5" class="pa-bg"/>
<text x="50" y="58" class="pa-title">Phase A — embedding baseline</text>
<text x="50" y="76" class="pa-note">Section 19 · same candidate pool conditions as TF-IDF · observe dup + Δt change</text>

<rect x="50" y="92" width="172" height="56" rx="8" stroke-width="0.5" class="pa-card"/>
<text x="136" y="116" text-anchor="middle" class="pa-title">MiniLM encoding</text>
<text x="136" y="134" text-anchor="middle" class="pa-sub">demand_text + paper_text</text>

<rect x="254" y="92" width="172" height="56" rx="8" stroke-width="0.5" class="pa-card"/>
<text x="340" y="116" text-anchor="middle" class="pa-title">FAISS full retrieval</text>
<text x="340" y="134" text-anchor="middle" class="pa-sub">1.2M arxiv_pilot_labeled</text>

<rect x="458" y="92" width="172" height="56" rx="8" stroke-width="0.5" class="pa-card"/>
<text x="544" y="116" text-anchor="middle" class="pa-title">DuckDB output</text>
<text x="544" y="134" text-anchor="middle" class="pa-sub">emb_baseline_matches</text>

<text x="340" y="180" text-anchor="middle" class="pa-note">exit: dup % and Δt median recorded · direct comparison row against TF-IDF baseline</text>
<line x1="340" y1="215" x2="340" y2="243" class="arr" marker-end="url(#arrow)"/>

<!-- Phase B: Ablation -->
<rect x="30" y="248" width="620" height="185" rx="12" stroke-width="0.5" class="pb-bg"/>
<text x="50" y="276" class="pb-title">Phase B — ablation experiments</text>
<text x="50" y="294" class="pb-note">Section 20 · one row per config · same metrics as baseline ablation table</text>

<rect x="50" y="310" width="172" height="56" rx="8" stroke-width="0.5" class="pb-card"/>
<text x="136" y="334" text-anchor="middle" class="pb-title">Time window check</text>
<text x="136" y="352" text-anchor="middle" class="pb-sub">inherit tw36 or drop?</text>

<rect x="254" y="310" width="172" height="56" rx="8" stroke-width="0.5" class="pb-card"/>
<text x="340" y="334" text-anchor="middle" class="pb-title">dup % comparison</text>
<text x="340" y="352" text-anchor="middle" class="pb-sub">vs ~54% TF-IDF baseline</text>

<rect x="458" y="310" width="172" height="56" rx="8" stroke-width="0.5" class="pb-card"/>
<text x="544" y="334" text-anchor="middle" class="pb-title">Δt main distribution</text>
<text x="544" y="352" text-anchor="middle" class="pb-sub">median vs 484–609 days</text>

<text x="340" y="398" text-anchor="middle" class="pb-note">exit: best embedding config selected · ablation table updated in NoteOfChange</text>
<line x1="340" y1="433" x2="340" y2="461" class="arr" marker-end="url(#arrow)"/>

<!-- Phase C: Golden set expansion -->
<rect x="30" y="466" width="620" height="185" rx="12" stroke-width="0.5" class="pc-bg"/>
<text x="50" y="494" class="pc-title">Phase C — golden set expansion</text>
<text x="50" y="512" class="pc-note">Section 21 · after ablation stable · target 150–200 pairs total</text>

<rect x="50" y="528" width="172" height="56" rx="8" stroke-width="0.5" class="pc-card"/>
<text x="136" y="552" text-anchor="middle" class="pc-title">Divergence mining</text>
<text x="136" y="570" text-anchor="middle" class="pc-sub">emb high · TF-IDF low</text>

<rect x="254" y="528" width="172" height="56" rx="8" stroke-width="0.5" class="pc-card"/>
<text x="340" y="552" text-anchor="middle" class="pc-title">Human annotation</text>
<text x="340" y="570" text-anchor="middle" class="pc-sub">temporal_ok + topic_ok</text>

<rect x="458" y="528" width="172" height="56" rx="8" stroke-width="0.5" class="pc-card"/>
<text x="544" y="552" text-anchor="middle" class="pc-title">P@10 re-evaluation</text>
<text x="544" y="570" text-anchor="middle" class="pc-sub">v2 locked, not modified</text>

<text x="340" y="616" text-anchor="middle" class="pc-note">exit: golden set v2 locked · 150–200 pairs · no further modification</text>
<line x1="340" y1="651" x2="340" y2="679" class="arr" marker-end="url(#arrow)"/>

<!-- Phase D: Skill-aware hybrid -->
<rect x="30" y="684" width="620" height="185" rx="12" stroke-width="0.5" class="pd-bg"/>
<text x="50" y="712" class="pd-title">Phase D — skill-aware hybrid</text>
<text x="50" y="730" class="pd-note">Section 22 · embedding + skill intensity · validate taxonomy fit first</text>

<rect x="50" y="746" width="172" height="56" rx="8" stroke-width="0.5" class="pd-card"/>
<text x="136" y="770" text-anchor="middle" class="pd-title">Taxonomy probe</text>
<text x="136" y="788" text-anchor="middle" class="pd-sub">O*NET / ESCO small-scale</text>

<rect x="254" y="746" width="172" height="56" rx="8" stroke-width="0.5" class="pd-card"/>
<text x="340" y="770" text-anchor="middle" class="pd-title">Skill intensity vector</text>
<text x="340" y="788" text-anchor="middle" class="pd-sub">LLM binary per skill</text>

<rect x="458" y="746" width="172" height="56" rx="8" stroke-width="0.5" class="pd-card"/>
<text x="544" y="770" text-anchor="middle" class="pd-title">Hybrid fusion</text>
<text x="544" y="788" text-anchor="middle" class="pd-sub">emb + skill · weight by ablation</text>

<text x="340" y="834" text-anchor="middle" class="pd-note">exit: best matcher locked · ablation confirms skill branch adds value · NoteOfChange updated</text>
<line x1="340" y1="869" x2="340" y2="897" class="arr" marker-end="url(#arrow)"/>

<!-- Phase E: Handoff -->
<rect x="30" y="902" width="620" height="58" rx="12" stroke-width="0.5" class="pe-bg"/>
<text x="340" y="926" text-anchor="middle" class="pe-title">Match complete → Frankie opens analysis branch from match tip</text>
<text x="340" y="946" text-anchor="middle" class="pe-sub">SOTA matcher locked · Δt benchmark ready for phase 4 diffusion gap analysis</text>

</svg>
